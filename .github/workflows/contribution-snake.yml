name: Contribution Observatory
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/contribution-snake.yml"
      - "scripts/contribution-observatory.mjs"
      - "README.md"
      - "assets/banner.svg"
permissions:
  contents: read
concurrency:
  group: contribution-observatory
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate and refresh contribution observatory
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/contribution-observatory.mjs
