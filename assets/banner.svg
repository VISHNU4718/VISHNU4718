<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a30"/><stop offset="1" stop-color="#202d49"/></linearGradient>
<style>
@keyframes paper{0%,5%{opacity:0;transform:translateY(12px)}12%,25%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(0)}}
@keyframes fold{0%,24%{opacity:0;transform:scale(.6)}32%,41%{opacity:1;transform:scale(1)}45%,100%{opacity:0;transform:scale(1)}}
@keyframes fly{0%,31%{opacity:0;transform:translate(0,0) rotate(0deg)}38%,43%{opacity:1;transform:translate(0,0) rotate(0deg)}57%{opacity:1;transform:translate(80px,-105px) rotate(-18deg)}73%{opacity:1;transform:translate(209px,-157px) rotate(8deg)}84%{opacity:0;transform:translate(266px,-146px) rotate(15deg)}100%{opacity:0;transform:translate(266px,-146px)}}
@keyframes arm{0%,15%,100%{transform:rotate(0deg)}24%,33%{transform:rotate(-12deg)}43%,57%{transform:rotate(-38deg)}70%{transform:rotate(0deg)}}
@keyframes trail{0%,44%{stroke-dashoffset:1;opacity:0}56%{opacity:.6}78%{stroke-dashoffset:0;opacity:.6}92%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes blink{0%,47%,51%,100%{transform:scaleY(1)}49%{transform:scaleY(.1)}}
.paper{animation:paper 10s ease-in-out infinite}.fold{transform-origin:920px 205px;animation:fold 10s ease-in-out infinite}.plane{animation:fly 10s ease-in-out infinite;transform-origin:920px 205px}.arm{transform-origin:887px 245px;animation:arm 10s ease-in-out infinite}.trail{stroke-dasharray:1;stroke-dashoffset:1;animation:trail 10s ease-in-out infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 10s infinite}
@media(prefers-reduced-motion:reduce){.paper,.fold,.plane,.arm,.trail,.eyes{animation:none}.paper,.fold{opacity:0}.plane{opacity:1}.trail{stroke-dashoffset:0}}
</style></defs>
