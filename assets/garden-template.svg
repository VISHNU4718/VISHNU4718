<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="Robot gardener on the real GitHub contribution calendar, {{DATE_ARIA}}">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101c27"/><stop offset="1" stop-color="#182e2a"/></linearGradient><clipPath id="clip"><rect width="1200" height="455" rx="20"/></clipPath></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#a9c2bc;font-size:13px}@keyframes bloom{0%,90%,100%{opacity:.8}95%{opacity:1}}.bloom{animation:bloom 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.robot{display:none}.bloom{animation:none}}{{ROBOT_CSS}}@keyframes blink{0%,43%,47%,100%{opacity:1}45%{opacity:.05}}@keyframes drift{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(12px,-5px);opacity:.65}}.water{animation:pour 70s linear infinite}.can{transform-origin:15px 2px;animation:tip 70s linear infinite}.eyes{animation:blink 5s infinite}.firefly{animation:drift 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){[class^="flower"],.firefly,.eyes,.can,.water{animation:none}.water{display:none}}{{FLOWER_CSS}}</style>
<g clip-path="url(#clip)"><rect width="1200" height="455" fill="url(#bg)"/>
<text x="40" y="36" font-size="16" fill="#d8e9df" letter-spacing="2">GROWING IDEAS INTO CODE</text>
<text x="1160" y="36" text-anchor="end">{{DATE_RANGE}}</text>
<g class="firefly" style="animation-delay:-2s"><circle cx="450" cy="52" r="1.5" fill="#eee5ac"/></g><g class="firefly" style="animation-delay:-6s"><circle cx="760" cy="47" r="1.3" fill="#a5dcd0"/></g><g class="firefly"><circle cx="990" cy="282" r="1.5" fill="#eee5ac"/></g><path d="M42 283Q230 255 390 281T710 280T1200 272V455H0Z" fill="#284739" opacity=".6"/>
{{GRID}}
{{MOTION}}
<ellipse cx="0" cy="7" rx="12" ry="4" fill="#0b181a" opacity=".45"/>
<path d="M-5 9v4m10 -4v4" stroke="#adc9bc" stroke-width="2.5" stroke-linecap="round"/>
<rect x="-10" y="-11" width="20" height="16" rx="5" fill="#d8e5da" stroke="#809e98"/>
<rect x="-6" y="4" width="12" height="7" rx="2" fill="#adc9bc"/>
<text x="0" y="9.5" text-anchor="middle" style="font-size:6px;font-weight:700;fill:#26424b">V</text>
<rect x="-7" y="-8" width="14" height="8" rx="3" fill="#26424b"/>
<g class="eyes"><circle cx="-3" cy="-4" r="1.5" fill="#9debd3"/><circle cx="3" cy="-4" r="1.5" fill="#9debd3"/></g><path d="M-2 1q2 2 4 0" fill="none" stroke="#26424b" stroke-width=".8"/>
<path d="M0 -11v-5" stroke="#adc9bc" stroke-width="1.5"/><circle cx="0" cy="-17" r="2" fill="#e9c384"/>
<path d="M10 -3l5 5" stroke="#adc9bc" stroke-width="2" stroke-linecap="round"/>
<g class="can"><path d="M14 0h6v5h-5Z" fill="#90b8c9"/><path d="M20 1l4 2" stroke="#90b8c9" stroke-width="2"/></g>
<g class="water" fill="#a2dbd5"><circle cx="26" cy="5" r="1"/><circle cx="28" cy="8" r=".8"/><circle cx="25" cy="9" r=".7"/></g>
</g></g>
<text x="40" y="310" fill="#d8e9df" font-size="15">One spot = one day · Flower colour = contributions that day</text><ellipse cx="53" cy="351" rx="7" ry="3" fill="#263d35" stroke="#83b394"/><text x="73" y="356" font-size="16">0 · empty</text><circle cx="282" cy="351" r="3" fill="#8bbfd6"/><circle cx="279" cy="356.19615242270663" r="3" fill="#8bbfd6"/><circle cx="273" cy="356.19615242270663" r="3" fill="#8bbfd6"/><circle cx="270" cy="351" r="3" fill="#8bbfd6"/><circle cx="273" cy="345.80384757729337" r="3" fill="#8bbfd6"/><circle cx="279" cy="345.80384757729337" r="3" fill="#8bbfd6"/><circle cx="276" cy="351" r="3" fill="#fff2cb"/><text x="296" y="356" font-size="16">1–3</text><circle cx="505" cy="351" r="3" fill="#b3a0df"/><circle cx="502" cy="356.19615242270663" r="3" fill="#b3a0df"/><circle cx="496" cy="356.19615242270663" r="3" fill="#b3a0df"/><circle cx="493" cy="351" r="3" fill="#b3a0df"/><circle cx="496" cy="345.80384757729337" r="3" fill="#b3a0df"/><circle cx="502" cy="345.80384757729337" r="3" fill="#b3a0df"/><circle cx="499" cy="351" r="3" fill="#fff2cb"/><text x="519" y="356" font-size="16">4–9</text><circle cx="728" cy="351" r="3" fill="#e2b8cb"/><circle cx="725" cy="356.19615242270663" r="3" fill="#e2b8cb"/><circle cx="719" cy="356.19615242270663" r="3" fill="#e2b8cb"/><circle cx="716" cy="351" r="3" fill="#e2b8cb"/><circle cx="719" cy="345.80384757729337" r="3" fill="#e2b8cb"/><circle cx="725" cy="345.80384757729337" r="3" fill="#e2b8cb"/><circle cx="722" cy="351" r="3" fill="#fff2cb"/><text x="742" y="356" font-size="16">10–19</text><circle cx="951" cy="351" r="3" fill="#f0dca4"/><circle cx="948" cy="356.19615242270663" r="3" fill="#f0dca4"/><circle cx="942" cy="356.19615242270663" r="3" fill="#f0dca4"/><circle cx="939" cy="351" r="3" fill="#f0dca4"/><circle cx="942" cy="345.80384757729337" r="3" fill="#f0dca4"/><circle cx="948" cy="345.80384757729337" r="3" fill="#f0dca4"/><circle cx="945" cy="351" r="3" fill="#fff2cb"/><text x="965" y="356" font-size="16">20+</text><text x="40" y="394">Read left to right by week. Watering is decorative; your real activity stays visible.</text><g transform="translate(1125 415)"><rect x="-28" y="-5" width="56" height="10" rx="5" fill="#587c71"/><text x="0" y="26" text-anchor="middle" font-size="12">&lt;/&gt; dock</text><path d="M-11 -2h22" stroke="#a7dcc8" stroke-width="2"/></g>
</g></svg>